<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descripción de Perfiles - Ofertas Staffing</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 18px rgba(0,0,0,0.12);
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 20px;
        }
        .header h1 {
            font-size: 24px;
            color: #1f2937;
        }
        .header p {
            color: #4b5563;
            margin: 0;
        }
        .card {
            border: 1px solid #d1d5db;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            background: #fafafa;
        }
        .card h2 {
            margin: 0 0 15px;
            font-size: 18px;
            color: #111827;
        }
        .card .info {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }
        .field {
            flex: 1 1 240px;
            min-width: 240px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .field label {
            font-size: 14px;
            color: #374151;
            font-weight: 600;
        }
        .field textarea {
            resize: vertical;
            min-height: 140px;
            max-height: 360px;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.5;
            background: white;
        }
        .field textarea:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59,130,246,0.12);
        }
        .field .summary {
            color: #6b7280;
            font-size: 13px;
        }
        .buttons {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 20px;
        }
        .btn {
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            font-size: 15px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }
        .btn-secondary {
            background: #e5e7eb;
            color: #111827;
        }
        .btn-secondary:hover {
            background: #d1d5db;
        }
        .btn-primary {
            background: #2563eb;
            color: white;
        }
        .btn-primary:hover {
            background: #1d4ed8;
        }
        .empty-state {
            text-align: center;
            color: #6b7280;
            padding: 50px 20px;
            border: 1px dashed #d1d5db;
            border-radius: 12px;
            background: #f9fafb;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h1>Información extendida de perfiles</h1>
                <p>Agrega experiencia, descripción, conocimientos y funciones para cada perfil seleccionado.</p>
            </div>
            <button class="btn btn-secondary" onclick="volver()">← Volver</button>
        </div>

        <div id="cardsContainer"></div>

        <div class="buttons">
            <button class="btn btn-secondary" onclick="volver()">Regresar a costos</button>
            <button class="btn btn-primary" onclick="guardarDescripcion(true, './Reporte.html')">Guardar descripción</button>
        </div>
    </div>

    <script>
        const perfilesSeleccionados = JSON.parse(localStorage.getItem('perfilesSeleccionados') || '[]');
        const descripcionGuardada = JSON.parse(localStorage.getItem('perfilesDescripcion') || '[]');

        function volver() {
            window.location.href = './Seleccionados.html';
        }

        function crearTarjeta(perfil, index) {
            const card = document.createElement('div');
            card.className = 'card';
            const saved = descripcionGuardada.find(item => item.uuid === perfil.uuid || item.nombre === perfil.nombre) || {};

            card.innerHTML = `
                <h2>${perfil.nombre}</h2>
                <div class="info">
                    <div class="field">
                        <label for="experiencia-${index}">Experiencia en</label>
                        <textarea id="experiencia-${index}" placeholder="Describe la experiencia ideal para este perfil...">${saved.experiencia || ''}</textarea>
                        <span class="summary">Ingresa detalles sobre años, tecnologías y responsabilidades.</span>
                    </div>
                    <div class="field">
                        <label for="descripcion-${index}">Descripción</label>
                        <textarea id="descripcion-${index}" placeholder="Describe el rol, el contexto del proyecto y los objetivos...">${saved.descripcion || ''}</textarea>
                        <span class="summary">Esta descripción puede ser extensa para explicar el perfil.</span>
                    </div>
                    <div class="field">
                        <label for="conocimientos-${index}">Conocimientos en</label>
                        <textarea id="conocimientos-${index}" placeholder="Lista herramientas, lenguajes y metodologías clave...">${saved.conocimientos || ''}</textarea>
                        <span class="summary">Incluye tecnologías, frameworks y certificaciones relevantes.</span>
                    </div>
                    <div class="field">
                        <label for="funciones-${index}">Funciones</label>
                        <textarea id="funciones-${index}" placeholder="Describe las responsabilidades principales...">${saved.funciones || ''}</textarea>
                        <span class="summary">Ej. desarrollo, soporte, coordinación o liderazgo técnico.</span>
                    </div>
                </div>
            `;
            return card;
        }

        function renderCards() {
            const container = document.getElementById('cardsContainer');
            container.innerHTML = '';

            if (perfilesSeleccionados.length === 0) {
                const empty = document.createElement('div');
                empty.className = 'empty-state';
                empty.innerHTML = '<strong>No hay perfiles seleccionados.</strong><br>Regresa a la pantalla de costos para seleccionar al menos un perfil.';
                container.appendChild(empty);
                return;
            }

            perfilesSeleccionados.forEach((perfil, index) => {
                container.appendChild(crearTarjeta(perfil, index));
            });
        }

        const API_BASE = window.location.protocol === 'file:' ? 'http://127.0.0.1:5000' : '';

        async function guardarDescripcion(showAlert = true, redirectTo = null) {
            if (perfilesSeleccionados.length === 0) {
                if (showAlert) alert('No hay perfiles para guardar. Regresa a la pantalla anterior.');
                return false;
            }

            const datos = perfilesSeleccionados.map((perfil, index) => ({
                uuid: perfil.uuid || perfil.id || index,
                nombre: perfil.nombre,
                costoEmpresa: perfil.costoEmpresa || perfil.costo || 0,
                experiencia: document.getElementById(`experiencia-${index}`).value.trim(),
                descripcion: document.getElementById(`descripcion-${index}`).value.trim(),
                conocimientos: document.getElementById(`conocimientos-${index}`).value.trim(),
                funciones: document.getElementById(`funciones-${index}`).value.trim(),
            }));

            localStorage.setItem('perfilesDescripcion', JSON.stringify(datos));

            try {
                const response = await fetch(`${API_BASE}/api/descripcion`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({perfiles: datos})
                });
                if (!response.ok) throw new Error('Error guardando descripción');
                if (showAlert) alert('Descripciones guardadas correctamente.');
                if (redirectTo) {
                    window.location.href = redirectTo;
                }
                return true;
            } catch (error) {
                console.error(error);
                alert('No se pudo guardar la descripción. Intenta nuevamente.');
                return false;
            }
        }

        function irReporte() {
            guardarDescripcion(false, 'Reporte.html');
        }

        renderCards();
    </script>
    <footer style="max-width:1200px;margin:20px auto 40px;display:flex;justify-content:flex-end;gap:10px;">
        <button style="background:#dc3545;color:white;border:none;padding:10px 18px;border-radius:8px;cursor:pointer;" onclick="cerrarSesion()">Cerrar Sesión</button>
    </footer>

    <script src="./common.js"></script>
</body>
</html>
